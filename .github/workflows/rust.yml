name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # Every feature can be used alone; make sure each one builds, is
      # lint-clean and passes its tests, and that the common table works with
      # the decoder and the scanner.
      - name: Clippy + test, each feature on its own
        run: |
          for f in "" "decode" "scan" "signatures" "common-signatures" \
                   "decode,common-signatures" "scan,common-signatures"; do
            echo "::group::features: '${f}'"
            cargo clippy --all-targets --no-default-features --features "$f" -- -D warnings
            cargo test --no-default-features --features "$f"
            echo "::endgroup::"
          done

      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package
        run: cargo package

  generated:
    name: Generated tables are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # For gofmt, which formats the generated signatures.go.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Regenerate every table from signatures.js
        run: php make_signatures.php --from-js

      - name: Check for differences
        run: git diff --exit-code signatures.go signatures.js src/signatures.rs src/signatures_common.rs

  no_std:
    name: no_std, no alloc (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bare-metal targets have neither `std` nor a global allocator, so a
        # successful build proves the crate needs neither.
        target: [thumbv6m-none-eabi, thumbv7em-none-eabihf, riscv32imc-unknown-none-elf]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (default features)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (signatures only)
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features signatures

      - name: Build (decode with the common table)
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features decode,common-signatures

      - name: Build (decode only)
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features decode

      - name: Build (scan only)
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features scan

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.89 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.89

      - name: Test
        run: cargo test
