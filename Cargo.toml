[package]
name = "evmabiless"
version = "0.1.16"
edition = "2024"
rust-version = "1.85"
description = "Recover the ABI of a deployed EVM contract from its bytecode using a built-in table of known selectors. no_std, no alloc."
repository = "https://github.com/KarpelesLab/evmabiless"
license = "MIT"
keywords = ["ethereum", "evm", "abi", "solidity", "no-std"]
categories = ["cryptography::cryptocurrencies", "no-std", "no-std::no-alloc", "parser-implementations"]
# The repository also hosts the Go module and the npm package; only ship the
# Rust sources in the published .crate.
include = ["/src/**/*.rs", "/tests/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[features]
default = ["decode", "scan", "signatures"]
# Calldata decoding: `Abi::decode_input`. With `signatures`, also
# `decode_calldata`.
decode = []
# Bytecode scanner: `scan_contract`, `scan_contract_hex`. With `signatures`,
# also `abi_list` and `abi_list_hex`.
scan = []
# Built-in signature table: `lookup_abi`, `signatures`. Most of the crate's
# size.
signatures = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dev-dependencies]
tiny-keccak = { version = "2", features = ["keccak"] }
